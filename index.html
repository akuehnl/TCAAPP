<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TCA Tasks</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Auth screen -->
  <section id="auth-screen" class="card hidden">
    <h1>TCA Tasks</h1>
    <p class="subtitle">Sign in or create an account to manage tasks.</p>

    <form id="auth-form">
      <input type="email" id="email" placeholder="Email" required autocomplete="email" />
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password" minlength="6" />
      <div class="button-row">
        <button type="submit" id="sign-in-btn">Sign In</button>
        <button type="button" id="sign-up-btn">Sign Up</button>
      </div>
    </form>

    <p id="auth-message" class="message"></p>
  </section>

  <!-- Shown when a signed-in account isn't on the board roster -->
  <section id="not-member-screen" class="card hidden">
    <h1>Not on the roster</h1>
    <p class="subtitle">
      You're signed in as <strong id="not-member-email"></strong>, but that address
      isn't on the TCA board roster, so there are no tasks to show.
    </p>
    <p class="message">
      Ask Aden or Isaac to add your address to the roster, then sign in again.
    </p>
    <button id="not-member-sign-out" class="secondary">Sign out</button>
  </section>

  <!-- Task screen -->
  <section id="todo-screen" class="card hidden">
    <div class="header-row">
      <h1>TCA Tasks</h1>
      <div class="header-right">
        <span id="user-email"></span>
        <button id="sign-out-btn" class="link-btn">Sign out</button>
      </div>
    </div>

    <!-- Shared board vs. just my assignments -->
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tab-all" role="tab">Shared board</button>
      <button type="button" class="tab" id="tab-mine" role="tab">My tasks</button>
    </div>

    <div class="toolbar">
      <button type="button" id="new-task-btn">+ New task</button>

      <div class="filters">
        <label class="inline-field" id="assignee-filter-wrap">
          <span>Assignee</span>
          <select id="assignee-filter">
            <option value="">Anyone</option>
            <option value="unassigned">Unassigned</option>
          </select>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="hide-done" /> Hide done
        </label>
      </div>
    </div>

    <!-- Create / edit form -->
    <form id="task-form" class="task-form hidden">
      <h2 id="form-heading">New task</h2>

      <div class="field full">
        <label for="f-title">Title</label>
        <input type="text" id="f-title" required maxlength="300" />
      </div>

      <div class="field">
        <label for="f-assignee">Assignee</label>
        <select id="f-assignee">
          <option value="">Unassigned</option>
        </select>
      </div>

      <div class="field">
        <label for="f-due-date">Due date</label>
        <input type="date" id="f-due-date" />
      </div>

      <div class="field">
        <label for="f-priority">Priority</label>
        <select id="f-priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>

      <div class="field">
        <label for="f-status">Status</label>
        <select id="f-status">
          <option value="open" selected>Open</option>
          <option value="done">Done</option>
        </select>
      </div>

      <div class="field">
        <label for="f-work-hours">Est. work hours</label>
        <input type="number" id="f-work-hours" min="0" step="0.25" placeholder="Hands-on effort" />
      </div>

      <div class="field">
        <label for="f-calendar-days">Est. calendar days</label>
        <input type="number" id="f-calendar-days" min="0" step="0.5" placeholder="Wall-clock time" />
      </div>

      <div class="field full">
        <label for="f-project-label">Project / group <span class="optional">optional</span></label>
        <input type="text" id="f-project-label" list="label-options" maxlength="120" />
        <datalist id="label-options"></datalist>
      </div>

      <div class="field full">
        <label for="f-notes">Notes <span class="optional">optional</span></label>
        <textarea id="f-notes" rows="3"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" id="save-btn">Save task</button>
        <button type="button" id="cancel-btn" class="secondary">Cancel</button>
        <span id="form-message" class="message"></span>
      </div>
    </form>

    <ul id="task-list"></ul>

    <p id="empty-state" class="message hidden"></p>
  </section>

  <p id="loading" class="message">Loading…</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
